name: Program dates check
on:
  schedule:
    - cron: "0 13 * * *"   # daily check and Monday digest, 13:00 UTC
    - cron: "0 1 * * *"   # second daily check, 12 hours after the first
  workflow_dispatch:
    inputs:
      recheck_posted:
        description: Recheck programs currently marked Out Now
        required: false
        type: boolean
        default: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install gspread requests
      - run: python program-check.py
        env:
          TARGET_YEAR: "2027"
          FORCE_EMAIL: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          RECHECK_POSTED: ${{ github.event_name == 'workflow_dispatch' && inputs.recheck_posted && '1' || '0' }}
          WEEKLY_DIGEST: ${{ github.event.schedule == '0 13 * * *' && '1' || '0' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
